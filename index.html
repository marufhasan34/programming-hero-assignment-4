<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <!-- tailwind + daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- tailwind + daisyUI -->
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- google fonts -->
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <header class="w-[80%] mx-auto">
      <h1 class="font-bold text-3xl mt-14 mb-5">Job Application Tracker</h1>
      <div class="grid grid-cols-3 gap-6">
        <div class="p-5 shadow-xl rounded-xl space-y-2">
          <p class="font-medium">total</p>
          <p class="font-bold text-2xl">0</p>
        </div>
        <div class="p-5 shadow-xl rounded-xl space-y-2">
          <p class="font-medium">Interview</p>
          <p class="font-bold text-2xl text-green-600">0</p>
        </div>
        <div class="p-5 shadow-xl rounded-xl space-y-2">
          <p class="font-medium">Rejected</p>
          <p class="font-bold text-2xl text-red-600">0</p>
        </div>
      </div>
    </header>
  </body>
</html>
